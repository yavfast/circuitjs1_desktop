          - id: element-categories
            path: src/main/java/com/lushprojects/circuitjs1/client/element
            files: 135
            order: 4
            categories:
              - passives        # ResistorElm, CapacitorElm, InductorElm, PotElm, VaristorElm, MemristorElm, SparkGapElm, etc.
              - sources         # DCVoltageElm, ACVoltageElm, VoltageElm, CurrentElm, RailElm, ACRailElm, NoiseElm, SweepElm, etc.
              - diodes-and-semis  # DiodeElm, ZenerDiodeElm, TunnelDiodeElm, LEDElm, SCRElm, TriacElm, DiacElm, etc.
              - transistors     # TransistorElm, MosfetElm, JfetElm, DarlingtonElm, TriodeElm, etc.
              - opamps-analog   # OpAmpElm, ComparatorElm, VCVSElm, CCVSElm, CCCSElm, etc.
              - logic-gates     # AndGateElm, OrGateElm, NandGateElm, NorGateElm, XorGateElm, InverterElm, etc.
              - flip-flops-counters  # FlipFlopElm, CounterElm, Counter2Elm, ShiftRegisterElm, etc.
              - chips           # ChipElm-derived ICs: ADCElm, DACElm, DecoderElm, MuxElm, etc.
              - switches        # AnalogSwitchElm, AnalogSwitch2Elm, CrossSwitchElm, SwitchElm variants
              - io              # LogicInputElm, LogicOutputElm, DataInputElm, OutputElm, DecimalDisplayElm, etc.
              - audio-rf        # AudioInputElm, AudioOutputElm, AMElm, FMElm, AntennaElm, CrystalElm
              - motors-mech     # DCMotorElm, relays, etc.
              - measurement     # AmmeterElm, VoltmeterElm, ScopeElm, DataRecorderElm
              - graphic         # BoxElm, TextElm, GraphicElm variants
              - misc-advanced   # CustomLogicElm, CustomCompositeChipElm, SRAMElm, etc.
            notes: "Category groups are analyzed as one bundle each — all variants share the same base-class contract; the per-file differences are parameters, drawing, and simulation step details. The exact category mapping will be finalized during analysis based on class hierarchy and element tags."
